# ============================================================================
# AUTOMOTORAFC - Pipeline CI/CD del Backend (US-13)
# Publica la API Django en el App Service "automotorafc-api".
#
# Requisito previo unico en Azure DevOps:
#   Project Settings > Service connections > New > Azure Resource Manager,
#   nombrada igual que la variable azureSubscription de mas abajo.
# ============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*
      - azure-pipelines-backend.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*

variables:
  # Nombre EXACTO de la service connection en:
  # Project Settings > Service connections
  - name: azureSubscription
    value: "azure-automotorafc"
  - name: appServiceName
    value: "automotorafc-api"
  - name: pythonVersion
    value: "3.11"
  - name: workingDir
    value: "$(System.DefaultWorkingDirectory)/backend"

stages:
  # --------------------------------------------------------------------------
  - stage: Build
    displayName: Compilar y probar
    jobs:
      - job: BuildTest
        displayName: Instalar dependencias y ejecutar pruebas
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            displayName: Usar Python $(pythonVersion)
            inputs:
              versionSpec: "$(pythonVersion)"

          # El venv va en la carpeta temporal del agente, NO dentro de
          # backend/: un virtualenv lleva rutas absolutas grabadas y si viaja
          # dentro del paquete, Azure lo activa y gunicorn apunta a una ruta
          # inexistente (el contenedor muere con exit code 127).
          - script: |
              python -m venv $(Agent.TempDirectory)/venv
              source $(Agent.TempDirectory)/venv/bin/activate
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            workingDirectory: $(workingDir)
            displayName: Instalar dependencias

          - script: |
              source $(Agent.TempDirectory)/venv/bin/activate
              python manage.py check
            workingDirectory: $(workingDir)
            displayName: Validar configuracion de Django

          - script: |
              source $(Agent.TempDirectory)/venv/bin/activate
              python manage.py makemigrations --check --dry-run
            workingDirectory: $(workingDir)
            displayName: Verificar que no falten migraciones

          - script: |
              source $(Agent.TempDirectory)/venv/bin/activate
              python manage.py test --verbosity 2
            workingDirectory: $(workingDir)
            displayName: Ejecutar pruebas unitarias
            env:
              DJANGO_DEBUG: "False"
              DJANGO_SECRET_KEY: $(Build.BuildId)-clave-de-pruebas
              DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

          # Los estaticos se recolectan AQUI y viajan ya listos en el
          # paquete, para que el arranque en Azure no gaste CPU en esto
          # (critico en el plan F1, que apaga la app entre visitas).
          - script: |
              source $(Agent.TempDirectory)/venv/bin/activate
              python manage.py collectstatic --noinput
            workingDirectory: $(workingDir)
            displayName: Recolectar archivos estaticos
            env:
              DJANGO_SECRET_KEY: $(Build.BuildId)-clave-de-compilacion

          # Azure instala las dependencias por su cuenta (Oryx) a partir de
          # requirements.txt, asi que el paquete lleva el codigo fuente mas
          # los estaticos ya recolectados.
          - task: CopyFiles@2
            displayName: Preparar paquete de despliegue
            inputs:
              SourceFolder: $(workingDir)
              Contents: |
                **
                !**/antenv/**
                !**/.venv/**
                !**/venv/**
                !**/__pycache__/**
                !**/*.pyc
                !**/db.sqlite3
                !**/.env
              TargetFolder: $(Build.ArtifactStagingDirectory)/app

          - task: ArchiveFiles@2
            displayName: Empaquetar aplicacion
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/app
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/backend.zip
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/backend.zip
            artifact: backend
            displayName: Publicar artefacto

  # --------------------------------------------------------------------------
  - stage: Deploy
    displayName: Desplegar en Azure App Service
    dependsOn: Build
    condition: >-
      and(succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployBackend
        displayName: Publicar en $(appServiceName)
        environment: produccion
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: backend

                - task: AzureWebApp@1
                  displayName: Desplegar API Django
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(appServiceName)
                    package: $(Pipeline.Workspace)/backend/backend.zip
                    runtimeStack: "PYTHON|3.11"
                    startUpCommand: "bash /home/site/wwwroot/startup.sh"
                    appSettings: >-
                      -SCM_DO_BUILD_DURING_DEPLOYMENT true
                      -ENABLE_ORYX_BUILD true
